[project]
name = "agent2agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Fayiz", email = "mohamedfayiz81@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
agent2agent = "agent2agent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
